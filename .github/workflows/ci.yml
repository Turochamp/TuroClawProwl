name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          dotnet-quality: ga

      - name: Restore
        run: dotnet restore TuroClawProwl.sln

      - name: Build
        run: dotnet build TuroClawProwl.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test TuroClawProwl.sln --configuration Release --no-build --logger "console;verbosity=minimal"
